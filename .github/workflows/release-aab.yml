name: Play Store bundle

# Run by hand once the four RELEASE_* secrets exist (see store/PLAY-STORE-STEPS.md).
# Produces a signed .aab to upload to Play Console.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PhxWidget-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
